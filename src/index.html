<!doctype html>
<html lang="fr" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Comprendre ses schémas</title>
    <meta name="description" content="Psychoéducation et auto-soin en vue d’une thérapie des schémas : comprendre ses schémas (J. Young), trouver le sien, et avancer un geste à la fois.">
    <meta name="robots" content="{{ROBOTS}}">
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121B1F" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{BASE}}icons/icon-192.png">
    <link rel="manifest" href="{{BASE}}manifest.webmanifest">
    {{FONTS}}
    {{CSS}}
    <script>
      // Applique le thème et les préférences avant le premier affichage (évite le « flash »).
      try {
        var s = JSON.parse(localStorage.getItem("autosoin:v1:prefs") || "{}");
        var r = document.documentElement;
        if (s.theme === "light" || s.theme === "dark") r.setAttribute("data-theme", s.theme);
        if (s.motion === "reduced" || s.motion === "full") r.setAttribute("data-motion", s.motion);
        if (s.size) r.style.setProperty("--text-scale", String(s.size));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:sans-serif">Ce site nécessite JavaScript. Les contenus de psychoéducation sont aussi disponibles dans le diaporama.</p></noscript>
    {{JS}}
  </body>
</html>
